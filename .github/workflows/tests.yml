name: OCN public candidate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install selected core
        run: python -m pip install ./packages/ocn-core
      - name: Core tests
        run: python -m unittest discover -s packages/ocn-core/tests -q
      - name: Offline document demonstration
        run: python packages/ocn-core/examples/evidence_context.py
      - name: Verify recorded coupled experiments
        run: |
          python experiments/ocn_coupled_documents/verify.py experiments/ocn_coupled_documents/results/run.json
          python experiments/ocn_probe_value_v1/verify.py experiments/ocn_probe_value_v1/results/run.json
          python experiments/ocn_probe_lease_v2/verify.py experiments/ocn_probe_lease_v2/results/run.json
          python experiments/ocn_viability_routes_v3/verify.py experiments/ocn_viability_routes_v3/results/run.json
